name: Validate casebook photo editor
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y fonts-nanum poppler-utils
      - run: node tests/casebook-book-print.mjs
